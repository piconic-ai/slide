<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>reveal.js fixture: fragments</title>
    <link rel="stylesheet" href="dist/reset.css" />
    <link rel="stylesheet" href="dist/reveal.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section><h2>一ページ目 alpha</h2></section>
        <section><h2>二ページ目 bravo</h2></section>
        <section>
          <h2>三ページ目 charlie</h2>
          <p class="fragment">first-step</p>
          <p class="fragment">second-step</p>
        </section>
        <section><h2>四ページ目 delta</h2></section>
        <section><h2>五ページ目 echo</h2></section>
      </div>
    </div>
    <script src="dist/reveal.js"></script>
    <!-- The defaults; the third page shows its lines one at a time (fragments). -->
    <script>
      Reveal.initialize()
    </script>
  </body>
</html>
