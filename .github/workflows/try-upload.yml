name: Try slide uploads

on:
  push:
    branches: [f01/upload-contract]
    paths:
      - 'src/uploads/**'
      - 'scripts/upload.mjs'
      - 'examples/**'
      - '.github/workflows/try-upload.yml'

permissions:
  contents: read

jobs:
  upload:
    if: vars.SLIDE_UPLOAD_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Upload checked-in HTML
        run: |
          mkdir -p "$RUNNER_TEMP/public-reports"
          node scripts/upload.mjs examples/static https://slide.piconic.ai
        env:
          SLIDE_REPORT_FILE: ${{ runner.temp }}/public-reports/static.json
      - name: Build Markdown on the author side
        run: |
          mkdir -p "$RUNNER_TEMP/markdown"
          npx --yes @marp-team/marp-cli@4.5.1 examples/markdown/slides.md --output "$RUNNER_TEMP/markdown/index.html"
      - name: Upload the built Markdown output
        run: node scripts/upload.mjs "$RUNNER_TEMP/markdown" https://slide.piconic.ai
        env:
          SLIDE_REPORT_FILE: ${{ runner.temp }}/public-reports/markdown.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: slide-upload-reports
          path: ${{ runner.temp }}/public-reports/*.json
          retention-days: 1
          if-no-files-found: error
