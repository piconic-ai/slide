name: Try slide uploads

on:
  # Run from the Actions tab on a branch connected to the try decks.
  workflow_dispatch:
  push:
    branches: [f01/upload-contract]
    paths:
      - 'src/uploads/**'
      - 'scripts/upload.mjs'
      - 'action.yml'
      - 'examples/**'
      - '.github/workflows/try-upload.yml'

permissions:
  contents: read

jobs:
  upload:
    if: vars.SLIDE_UPLOAD_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: mkdir -p "$RUNNER_TEMP/public-reports"
      - name: Upload checked-in HTML
        uses: ./
        with:
          directory: examples/static
          deck: try-static
          report-file: ${{ runner.temp }}/public-reports/static.json
      - name: Build Markdown on the author side
        run: |
          mkdir -p "$RUNNER_TEMP/markdown"
          npx --yes @marp-team/marp-cli@4.5.1 examples/markdown/slides.md --output "$RUNNER_TEMP/markdown/index.html"
      - name: Upload the built Markdown output
        uses: ./
        with:
          directory: ${{ runner.temp }}/markdown
          deck: try-markdown
          report-file: ${{ runner.temp }}/public-reports/markdown.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: slide-upload-reports
          path: ${{ runner.temp }}/public-reports/*.json
          retention-days: 1
          if-no-files-found: error
