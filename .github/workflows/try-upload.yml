name: Try slide uploads

on:
  push:
    branches: [f01/upload-contract]
    paths:
      - 'src/uploads/**'
      - 'scripts/upload.mjs'
      - 'examples/**'
      - '.github/workflows/try-upload.yml'

permissions:
  contents: read

jobs:
  upload:
    if: vars.SLIDE_UPLOAD_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Upload checked-in HTML
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          node scripts/upload.mjs examples/static https://slide.piconic.ai
        env:
          SLIDE_CREDENTIAL_FILE: ${{ runner.temp }}/receipts/static.json
      - name: Build Markdown on the author side
        run: |
          mkdir -p "$RUNNER_TEMP/markdown"
          npx --yes @marp-team/marp-cli@4.5.1 examples/markdown/slides.md --output "$RUNNER_TEMP/markdown/index.html"
      - name: Upload the built Markdown output
        run: node scripts/upload.mjs "$RUNNER_TEMP/markdown" https://slide.piconic.ai
        env:
          SLIDE_CREDENTIAL_FILE: ${{ runner.temp }}/receipts/markdown.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slide-preview-receipts
          path: ${{ runner.temp }}/receipts/*.json
          retention-days: 1
          if-no-files-found: error
