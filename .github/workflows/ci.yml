name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for its older
# commit. Runs on main are never cancelled: deploys check main's latest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything the tests, the build or the
  # complexity check look at. A pull request that changes only documents
  # skips them; pushes to main always run everything, since deploys check
  # main's latest run. Two documents are read by tests and count as code.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # The merge commit's first parent is the base it is tested on.
            # A failing diff stops the step, so it never reads as documents.
            # Without renames, a moved file lists its old path as well.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            test -n "$files"
            code=false
            while IFS= read -r file; do
              case "$file" in
                docs/dev/er-diagram.md | docs/dev/deploy.md) code=true ;;
                docs/*.md | docs/*.canvas | .agents/*.md) ;;
                */*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
  actions-lock:
    name: Workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  tests:
    name: ${{ matrix.shard == 'pure' && 'Pure tests' || format('Tests (non-pure shard {0}/6)', matrix.shard) }}
    needs: changes
    # Skipped step by step, not as a job: a skipped matrix job is shown
    # under its unexpanded name.
    env:
      CODE: ${{ needs.changes.outputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [pure, 1, 2, 3, 4, 5, 6]
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@v7.0.1
      - if: env.CODE == 'true'
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - if: env.CODE == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: env.CODE == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.CODE == 'true' && matrix.shard == 1
        run: pnpm format:check
      - if: env.CODE == 'true' && matrix.shard != 'pure'
        run: pnpm build
      - if: env.CODE == 'true' && matrix.shard == 1
        run: pnpm exec tsc --noEmit
      - if: env.CODE == 'true' && matrix.shard != 'pure'
        run: pnpm exec playwright install --with-deps chromium
      - if: env.CODE == 'true' && matrix.shard == 'pure'
        run: >-
          pnpm test:coverage --config vitest.pure-coverage.config.ts --no-coverage.thresholds
          --reporter=default --reporter=./scripts/slow-test-reporter.mjs --reporter=blob --outputFile.blob=vitest-reports/shard-pure.json
      - if: env.CODE == 'true' && matrix.shard != 'pure'
        run: >-
          pnpm test:non-pure --coverage --no-coverage.thresholds
          --shard=${{ matrix.shard }}/6
          --reporter=default --reporter=./scripts/slow-test-reporter.mjs --reporter=blob --outputFile.blob=vitest-reports/shard-${{ matrix.shard }}.json
      - if: env.CODE == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: vitest-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
  code:
    name: Build, types and tests
    needs: [changes, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Require every shard to pass
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "$CODE" = true ]; then
            test "${{ needs.tests.result }}" = success
          else
            echo "Only documents changed: the tests were skipped."
          fi
      - uses: actions/checkout@v7.0.1
        if: env.CODE == 'true'
      - uses: pnpm/action-setup@v6.1.1
        if: env.CODE == 'true'
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        if: env.CODE == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CODE == 'true'
      - uses: actions/download-artifact@v8.0.2
        if: env.CODE == 'true'
        with:
          pattern: vitest-shard-*
          path: vitest-reports
          merge-multiple: true
      - name: Check combined coverage
        if: env.CODE == 'true'
        run: |
          for shard in pure 1 2 3 4 5 6; do
            test -s "vitest-reports/shard-${shard}.json"
          done
          # The shards already warned about slow tests; do not repeat it here.
          pnpm test:coverage --merge-reports=vitest-reports --reporter=default
  # The viewer's browser test on the engines that pnpm test does not cover,
  # the check of a link's address in the viewer, and the profile picture
  # shrunk in the browser (canvas writing PNG in Safari's engine as well).
  browsers:
    name: Viewer on ${{ matrix.browser }}
    needs: changes
    # Skipped step by step, not as a job: a skipped matrix job is shown
    # under its unexpanded name.
    env:
      CODE: ${{ needs.changes.outputs.code }}
    runs-on: ubuntu-latest
    # WebKit needs well over a hundred system packages, and on a slow
    # package mirror installing them alone has taken more than 15 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@v7.0.1
      - if: env.CODE == 'true'
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - if: env.CODE == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: env.CODE == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.CODE == 'true'
        run: pnpm build
      - if: env.CODE == 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - if: env.CODE == 'true'
        run: pnpm exec vitest run src/share/viewer.browser.test.ts src/preview/cross-deck.browser.test.ts src/preview/page-script.browser.test.ts src/profile/picture-auto.browser.test.ts src/share/link-check.browser.test.ts src/offline/frame-support.browser.test.ts src/offline/version-offline.browser.test.ts src/offline/viewer-offline.browser.test.ts
        env:
          BROWSER: ${{ matrix.browser }}
  cognitive-complexity:
    name: Cognitive complexity
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          config: cccc.toml
          path: .
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-docs.py
