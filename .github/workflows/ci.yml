name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot_first:
        type: boolean
        description: Run snapshot before replay in the paired benchmark
        default: false

permissions:
  contents: read

jobs:
  actions-lock:
    name: Workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  tests:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == 1
        run: pnpm format:check
      - run: pnpm build
      - if: matrix.shard == 1
        run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare fixtures on the same runner
        env:
          MODES: ${{ inputs.snapshot_first && 'snapshot replay' || 'replay snapshot' }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          for mode in $MODES; do
            start=$(date +%s%3N)
            SLIDE_BENCH_FIXTURE="$mode" pnpm test:coverage \
              --config experiments/d1-snapshot/compare.config.mjs --no-cache \
              --no-coverage.thresholds --shard="$SHARD/$TOTAL" \
              --reporter=default --reporter=blob --outputFile.blob="vitest-reports/$mode/shard-$SHARD.json"
            echo "SLIDE_TIMING $mode $SHARD $(( $(date +%s%3N) - start ))"
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: vitest-reports/
          if-no-files-found: error
          overwrite: true
  code:
    name: Build, types and tests
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.tests.result }}" = success
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vitest-shard-*
          path: vitest-reports
          merge-multiple: true
      - name: Check combined coverage
        run: |
          for mode in replay snapshot; do
            for shard in 1 2 3 4 5 6; do
              test -s "vitest-reports/$mode/shard-${shard}.json"
            done
            echo "Checking $mode"
            pnpm test:coverage --merge-reports="vitest-reports/$mode"
          done
  # The viewer's browser test on the engines that pnpm test does not cover.
  browsers:
    name: Viewer on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # WebKit needs well over a hundred system packages, and on a slow
    # package mirror installing them alone has taken more than 15 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec vitest run src/share/viewer.browser.test.ts src/preview/cross-deck.browser.test.ts
        env:
          BROWSER: ${{ matrix.browser }}
  cognitive-complexity:
    name: Cognitive complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          config: cccc.toml
          path: .
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-docs.py
