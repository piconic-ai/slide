name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for its older
# commit. Runs on main are never cancelled: deploys check main's latest run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-lock:
    name: Workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  tests:
    name: ${{ matrix.shard == 'pure' && 'Pure tests' || format('Tests (non-pure shard {0}/6)', matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [pure, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == 1
        run: pnpm format:check
      - if: matrix.shard != 'pure'
        run: pnpm build
      - if: matrix.shard == 1
        run: pnpm exec tsc --noEmit
      - if: matrix.shard != 'pure'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.shard == 'pure'
        run: >-
          pnpm test:coverage --config vitest.pure-coverage.config.ts --no-coverage.thresholds
          --reporter=default --reporter=blob --outputFile.blob=vitest-reports/shard-pure.json
      - if: matrix.shard != 'pure'
        run: >-
          pnpm test:non-pure --coverage --no-coverage.thresholds
          --shard=${{ matrix.shard }}/6
          --reporter=default --reporter=blob --outputFile.blob=vitest-reports/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: vitest-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
  code:
    name: Build, types and tests
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.tests.result }}" = success
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vitest-shard-*
          path: vitest-reports
          merge-multiple: true
      - name: Check combined coverage
        run: |
          for shard in pure 1 2 3 4 5 6; do
            test -s "vitest-reports/shard-${shard}.json"
          done
          pnpm test:coverage --merge-reports=vitest-reports
  # The viewer's browser test on the engines that pnpm test does not cover,
  # the check of a link's address in the viewer, and the profile picture
  # shrunk in the browser (canvas writing PNG in Safari's engine as well).
  browsers:
    name: Viewer on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # WebKit needs well over a hundred system packages, and on a slow
    # package mirror installing them alone has taken more than 15 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec vitest run src/share/viewer.browser.test.ts src/preview/cross-deck.browser.test.ts src/preview/page-script.browser.test.ts src/profile/picture-auto.browser.test.ts src/share/link-check.browser.test.ts
        env:
          BROWSER: ${{ matrix.browser }}
  cognitive-complexity:
    name: Cognitive complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          config: cccc.toml
          path: .
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-docs.py
