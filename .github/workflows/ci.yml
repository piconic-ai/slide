name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      six_shards:
        type: boolean
        description: Compare six Vitest shards with the three-shard baseline
        default: false

permissions:
  contents: read

jobs:
  actions-lock:
    name: Workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  tests:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.six_shards && '[1,2,3,4,5,6]' || '[1,2,3]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == 1
        run: pnpm format:check
      - run: pnpm build
      - if: matrix.shard == 1
        run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm test:coverage --no-coverage.thresholds
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=blob --outputFile.blob=vitest-reports/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: vitest-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          overwrite: true
  code:
    name: Build, types and tests
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to pass
        run: test "${{ needs.tests.result }}" = success
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vitest-shard-*
          path: vitest-reports
          merge-multiple: true
      - name: Check combined coverage
        run: |
          for shard in $(seq 1 "${{ inputs.six_shards && 6 || 3 }}"); do
            test -s "vitest-reports/shard-${shard}.json"
          done
          pnpm test:coverage --merge-reports=vitest-reports
  # The viewer's browser test on the engines that pnpm test does not cover.
  browsers:
    name: Viewer on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # WebKit needs well over a hundred system packages, and on a slow
    # package mirror installing them alone has taken more than 15 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec vitest run src/share/viewer.browser.test.ts src/preview/cross-deck.browser.test.ts
        env:
          BROWSER: ${{ matrix.browser }}
  cognitive-complexity:
    name: Cognitive complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          config: cccc.toml
          path: .
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/check-docs.py
